<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI STREAM OVERLAY</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Oswald', sans-serif;
    }
    
    /* Overlay Card Container */
    .slot-card {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      border-left: 6px solid #ff5a00;
      padding: 6px 14px;
      border-radius: 4px;
      color: #fff;
      width: max-content;
      gap: 10px;
    }

    /* Logo Image Styling */
    .team-logo {
      width: 35px;
      height: 35px;
      object-fit: contain;
      display: block;
    }

    .team-name {
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="overlay-container">
  <div class="slot-card" id="card" style="display: none;">
    <img id="teamLogo" class="team-logo" src="" alt="Logo" onerror="this.style.display='none'">
    <span id="teamName" class="team-name">TEAM NAME</span>
  </div>
</div>

<script>
  const LIVE_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/liveData.json";

  // Helper function to resolve logo path correctly
  function getLogoPath(logoVal) {
    if (!logoVal) return "";
    // Check if full URL or base64 string
    if (logoVal.startsWith("http://") || logoVal.startsWith("https://") || logoVal.startsWith("data:image")) {
      return logoVal;
    }
    // If logo is specified as filename/number (e.g. "1" or "team1")
    if (!logoVal.includes(".")) {
      return `logos/${logoVal}.png`; // 'logos/' folder path with .png extension
    }
    return `logos/${logoVal}`;
  }

  async function fetchLiveData() {
    try {
      const res = await fetch(LIVE_URL);
      const data = await res.json();
      
      if (data && data.name) {
        const card = document.getElementById('card');
        const logoImg = document.getElementById('teamLogo');
        const nameSpan = document.getElementById('teamName');

        // Update Accent Color
        if (data.sbg) {
          card.style.borderLeftColor = data.sbg;
        }

        // Update Team Name
        nameSpan.textContent = data.name;

        // Process and Update Logo Path
        const logoPath = getLogoPath(data.logo);
        if (logoPath) {
          logoImg.src = logoPath;
          logoImg.style.display = "block";
        } else {
          logoImg.style.display = "none";
        }

        card.style.display = "flex";
      }
    } catch (e) {
      console.error("Overlay sync error:", e);
    }
  }

  // Poll live data every 400ms
  setInterval(fetchLiveData, 400);
</script>
</body>
</html>
