<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI PRO DISPLAY PANEL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gfx-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      transform: scale(0.95);
    }

    #gfx-container.active {
      opacity: 1;
      transform: scale(1);
    }

    #displayGfx {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <div id="gfx-container">
    <img id="displayGfx" src="" alt="Live GFX">
  </div>

<script>
  const LIVE_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/liveData.json";
  let lastTimestamp = 0;

  async function checkLiveData() {
    try {
      const response = await fetch(LIVE_URL + '?t=' + Date.now());
      const data = await response.json();

      if (data && data.ts && data.ts !== lastTimestamp) {
        lastTimestamp = data.ts;
        updateDisplay(data.gfx);
      }
    } catch (e) {
      console.error("Sync Error:", e);
    }
  }

  function updateDisplay(imageUrl) {
    const container = document.getElementById('gfx-container');
    const img = document.getElementById('displayGfx');

    if (imageUrl && imageUrl.trim() !== '') {
      // Hide temporarily for smooth transition
      container.classList.remove('active');

      setTimeout(() => {
        img.src = imageUrl;
        img.onload = () => {
          container.classList.add('active');
        };
        img.onerror = () => {
          // If image fails to load, hide container gracefully
          container.classList.remove('active');
        };
      }, 200);
    } else {
      // If no image URL is provided, hide overlay
      container.classList.remove('active');
    }
  }

  // Poll Firebase every 1 second for instant update
  setInterval(checkLiveData, 1000);
  checkLiveData();
</script>
</body>
</html>
