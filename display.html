<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI CUSTOM STEPPED OVERLAY</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Teko', sans-serif;
    }

    /* Outer Wrapper for Animation */
    #layout-container {
      position: relative;
      display: flex;
      align-items: flex-start;
      opacity: 0;
      transform: translateY(15px) scale(0.95);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.6));
    }

    #layout-container.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Left Square Block (Logo / Slot Box) */
    .logo-box {
      width: 110px;
      height: 110px;
      background: #4a332a; /* Default color fallback */
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    .logo-box img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    /* Fallback Slot Text if Logo missing */
    .slot-fallback {
      color: #ffffff;
      font-size: 70px;
      font-weight: 700;
      line-height: 1;
    }

    /* Right Slanted Text Bar */
    .name-bar {
      height: 52px;
      background: #4a332a; /* Default color fallback */
      padding: 0 35px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(0 0, 85% 0, 100% 100%, 0 100%);
      margin-left: -2px; /* Smooth edge overlap */
      z-index: 1;
    }

    .team-name {
      color: #ffffff;
      font-size: 38px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      white-space: nowrap;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div id="layout-container">
    <!-- Left Block for Logo / 20 -->
    <div class="logo-box" id="logoBox">
      <img id="teamLogo" src="" alt="Logo" style="display:none;">
      <span id="slotText" class="slot-fallback">--</span>
    </div>

    <!-- Right Bar for Team Name -->
    <div class="name-bar" id="nameBar">
      <span class="team-name" id="teamName">TEAM</span>
    </div>
  </div>

<script>
  const LIVE_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/liveData.json";
  let lastTimestamp = 0;

  async function checkLiveData() {
    try {
      const response = await fetch(LIVE_URL + '?t=' + Date.now());
      const data = await response.json();

      if (data && data.ts && data.ts !== lastTimestamp) {
        lastTimestamp = data.ts;
        updateDisplay(data);
      }
    } catch (e) {
      console.error("Sync Error:", e);
    }
  }

  function updateDisplay(data) {
    const container = document.getElementById('layout-container');
    const logoBox = document.getElementById('logoBox');
    const nameBar = document.getElementById('nameBar');
    const teamLogo = document.getElementById('teamLogo');
    const slotText = document.getElementById('slotText');
    const teamName = document.getElementById('teamName');

    // Smooth transition
    container.classList.remove('active');

    setTimeout(() => {
      // 1. Team Name Update
      teamName.textContent = data.name || `TEAM ${data.slot || ''}`;

      // 2. Background Color Update (Admin Panel Slot Color)
      const themeColor = data.sbg || '#4a332a';
      logoBox.style.backgroundColor = themeColor;
      nameBar.style.backgroundColor = themeColor;

      // 3. Logo / Slot Number Display
      if (data.gfx && data.gfx.trim() !== '') {
        teamLogo.src = data.gfx;
        teamLogo.style.display = 'block';
        slotText.style.display = 'none';
      } else {
        teamLogo.style.display = 'none';
        slotText.textContent = data.slot || '--';
        slotText.style.display = 'block';
      }

      container.classList.add('active');
    }, 200);
  }

  // Poll Firebase every 1 second
  setInterval(checkLiveData, 1000);
  checkLiveData();
</script>
</body>
</html>
