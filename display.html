<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI OFFICIAL OVERLAY - AGENCY FB BOLD</title>
  <style>
    /* Agency FB Bold / Fallback Font Import */
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Agency FB', 'Oswald', sans-serif;
      font-weight: bold;
    }

    #overlay-container {
      position: absolute;
      top: 30px;
      left: 30px;
    }

    /* Main Container Structure */
    .stream-banner {
      display: flex;
      align-items: flex-start;
      position: relative;
    }

    /* Left Square Box (Logo Area) */
    .logo-box {
      background: var(--theme-color, #00877a);
      width: 100px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      padding: 10px;
    }

    /* Team Logo inside Left Box */
    .team-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Slot Number Fallback */
    .slot-fallback {
      color: #ffffff;
      font-size: 70px;
      font-weight: 700;
      line-height: 1;
      font-family: 'Agency FB', 'Oswald', sans-serif;
    }

    /* Top Slanted Banner (Team Name Area) */
    .name-banner {
      background: var(--theme-color, #00877a);
      height: 65px;
      padding: 0 45px 0 25px;
      display: flex;
      align-items: center;
      clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
      margin-left: 0px;
      z-index: 1;
    }

    /* Team Name Styling in Agency FB Bold */
    .team-name {
      color: #ffffff;
      font-size: 58px;
      font-weight: 900;
      font-family: 'Agency FB', 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="overlay-container">
  <div class="stream-banner" id="banner" style="display: none;">
    
    <!-- Left Logo Box -->
    <div class="logo-box" id="logoBox">
      <img id="teamLogo" class="team-logo" src="" alt="" onerror="showSlotFallback()">
      <span id="slotNumber" class="slot-fallback" style="display: none;">--</span>
    </div>

    <!-- Right Slanted Team Name Banner -->
    <div class="name-banner" id="nameBanner">
      <span id="teamName" class="team-name">TEAM NAME</span>
    </div>

  </div>
</div>

<script>
  // Tries the local server first (instant, only works if this overlay is on
  // the SAME PC as the admin panel's Python server). Falls back to Firebase
  // automatically if local isn't reachable (overlay on a different PC).
  // Once it figures out which one works, it remembers that choice so it
  // doesn't waste time re-testing local on every single poll -- but it will
  // re-check periodically in case the setup changes (e.g. you move the
  // overlay to this PC later).
  const LOCAL_LIVE_URL = "http://127.0.0.1:5000/live";
  const FIREBASE_LIVE_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/liveData.json";
  const LOCAL_TIMEOUT_MS = 300;
  const RECHECK_EVERY_N_POLLS = 50; // ~5 seconds at 100ms interval

  let connectionMode = null; // 'local' | 'firebase' | null (not yet determined)
  let pollCount = 0;
  let currentSlot = "";

  function getLogoPath(logoVal) {
    if (!logoVal) return "";
    if (logoVal.startsWith("http://") || logoVal.startsWith("https://") || logoVal.startsWith("data:image")) {
      return logoVal;
    }
    if (!logoVal.includes(".")) {
      return `logos/${logoVal}.png`;
    }
    return `logos/${logoVal}`;
  }

  function showSlotFallback() {
    const logoImg = document.getElementById('teamLogo');
    const slotSpan = document.getElementById('slotNumber');
    logoImg.style.display = "none";
    slotSpan.textContent = currentSlot;
    slotSpan.style.display = "block";
  }

  function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { signal: controller.signal })
      .then(res => res.json())
      .finally(() => clearTimeout(timer));
  }

  async function fetchLiveData() {
    pollCount++;
    let data = null;

    const shouldTryLocal =
      connectionMode === 'local' ||
      connectionMode === null ||
      (connectionMode === 'firebase' && pollCount % RECHECK_EVERY_N_POLLS === 0);

    if (shouldTryLocal) {
      try {
        data = await fetchWithTimeout(LOCAL_LIVE_URL, LOCAL_TIMEOUT_MS);
        if (connectionMode !== 'local') {
          console.log("Overlay: using LOCAL server (same-PC, fast mode)");
          connectionMode = 'local';
        }
      } catch (e) {
        if (connectionMode === 'local') {
          console.log("Overlay: local server lost -- falling back to Firebase");
        }
        connectionMode = null; // force a Firebase attempt below and re-detect next time
      }
    }

    if (data === null) {
      try {
        const res = await fetch(FIREBASE_LIVE_URL);
        data = await res.json();
        if (connectionMode !== 'firebase') {
          console.log("Overlay: using FIREBASE (cross-PC/remote mode)");
          connectionMode = 'firebase';
        }
      } catch (e) {
        console.error("Both local and Firebase failed:", e);
        return;
      }
    }

    applyLiveData(data);
  }

  function applyLiveData(data) {
      if (data && data.name) {
        const banner = document.getElementById('banner');
        const logoBox = document.getElementById('logoBox');
        const nameBanner = document.getElementById('nameBanner');
        const logoImg = document.getElementById('teamLogo');
        const slotSpan = document.getElementById('slotNumber');
        const nameSpan = document.getElementById('teamName');

        currentSlot = data.slot || "";

        // Apply Dynamic Color
        const activeColor = data.sbg || '#00877a';
        logoBox.style.setProperty('--theme-color', activeColor);
        nameBanner.style.setProperty('--theme-color', activeColor);

        // Set Team Name
        nameSpan.textContent = data.name;

        // Load Logo Path
        const logoPath = getLogoPath(data.logo);
        if (logoPath) {
          slotSpan.style.display = "none";
          logoImg.src = logoPath;
          logoImg.style.display = "block";
        } else {
          showSlotFallback();
        }

        banner.style.display = "flex";
      }
  }

  // CHANGED: interval dropped from 300ms to 100ms. This was expensive to do
  // against Firebase (internet round trip every poll) but is essentially
  // free against a local server, so we can poll more often for a snappier
  // feel without adding real load.
  setInterval(fetchLiveData, 100);
</script>
</body>
</html>
