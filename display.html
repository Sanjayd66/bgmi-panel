<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI OFFICIAL OVERLAY</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Teko', sans-serif;
    }

    #overlay-container {
      position: absolute;
      top: 30px;
      left: 30px;
    }

    /* Main Container Structure */
    .stream-banner {
      display: flex;
      align-items: flex-start;
      position: relative;
    }

    /* Left Square Box (Logo Area) */
    .logo-box {
      background: var(--theme-color, #00877a);
      width: 100px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      padding: 10px;
    }

    /* Team Logo inside Left Box */
    .team-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Slot Number Fallback (In case Logo isn't available) */
    .slot-fallback {
      color: #ffffff;
      font-size: 65px;
      font-weight: 700;
      line-height: 1;
    }

    /* Top Slanted Banner (Team Name Area) */
    .name-banner {
      background: var(--theme-color, #00877a);
      height: 65px;
      padding: 0 45px 0 25px;
      display: flex;
      align-items: center;
      clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
      margin-left: 0px;
      z-index: 1;
    }

    /* Team Name Styling */
    .team-name {
      color: #ffffff;
      font-size: 50px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="overlay-container">
  <div class="stream-banner" id="banner" style="display: none;">
    
    <!-- Left Logo Box (Where '17' was shown) -->
    <div class="logo-box" id="logoBox">
      <img id="teamLogo" class="team-logo" src="" alt="" onerror="showSlotFallback()">
      <span id="slotNumber" class="slot-fallback" style="display: none;">--</span>
    </div>

    <!-- Right Slanted Team Name Banner -->
    <div class="name-banner" id="nameBanner">
      <span id="teamName" class="team-name">TEAM NAME</span>
    </div>

  </div>
</div>

<script>
  const LIVE_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/liveData.json";
  let currentSlot = "";

  function getLogoPath(logoVal) {
    if (!logoVal) return "";
    if (logoVal.startsWith("http://") || logoVal.startsWith("https://") || logoVal.startsWith("data:image")) {
      return logoVal;
    }
    if (!logoVal.includes(".")) {
      return `logos/${logoVal}.png`;
    }
    return `logos/${logoVal}`;
  }

  function showSlotFallback() {
    const logoImg = document.getElementById('teamLogo');
    const slotSpan = document.getElementById('slotNumber');
    logoImg.style.display = "none";
    slotSpan.textContent = currentSlot;
    slotSpan.style.display = "block";
  }

  async function fetchLiveData() {
    try {
      const res = await fetch(LIVE_URL);
      const data = await res.json();
      
      if (data && data.name) {
        const banner = document.getElementById('banner');
        const logoBox = document.getElementById('logoBox');
        const nameBanner = document.getElementById('nameBanner');
        const logoImg = document.getElementById('teamLogo');
        const slotSpan = document.getElementById('slotNumber');
        const nameSpan = document.getElementById('teamName');

        currentSlot = data.slot || "";

        // Apply Dynamic Color Accent
        const activeColor = data.sbg || '#00877a';
        logoBox.style.setProperty('--theme-color', activeColor);
        nameBanner.style.setProperty('--theme-color', activeColor);

        // Set Team Name
        nameSpan.textContent = data.name;

        // Load Logo Path
        const logoPath = getLogoPath(data.logo);
        if (logoPath) {
          slotSpan.style.display = "none";
          logoImg.src = logoPath;
          logoImg.style.display = "block";
        } else {
          showSlotFallback();
        }

        banner.style.display = "flex";
      }
    } catch (e) {
      console.error("Syncing error:", e);
    }
  }

  setInterval(fetchLiveData, 300);
</script>
</body>
</html>
