<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI OFFICIAL OVERLAY - AGENCY FB BOLD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Agency FB', 'Oswald', sans-serif;
      font-weight: bold;
    }

    #overlay-container {
      position: absolute;
      top: 30px;
      left: 30px;
    }

    .stream-banner {
      display: flex;
      align-items: flex-start;
      position: relative;
    }

    .logo-box {
      background: var(--theme-color, #00877a);
      width: 100px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      padding: 10px;
    }

    .team-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .slot-fallback {
      color: var(--text-color, #ffffff);
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
      font-family: 'Agency FB', 'Oswald', sans-serif;
    }

    .name-banner {
      background: var(--theme-color, #00877a);
      height: 65px;
      min-width: 220px;
      max-width: 480px;
      width: fit-content;
      padding: 0 45px 0 25px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
      margin-left: 0px;
      z-index: 1;
      overflow: hidden;
      transition: width 0.25s ease;
    }

    .team-name {
      color: var(--text-color, #ffffff);
      font-size: 58px;
      font-weight: 900;
      font-family: 'Agency FB', 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      display: block;
    }
  </style>
</head>
<body>

<div id="overlay-container">
  <div class="stream-banner" id="banner" style="display: none;">
    <div class="logo-box" id="logoBox">
      <img id="teamLogo" class="team-logo" src="" alt="" onerror="showSlotFallback()">
      <span id="slotNumber" class="slot-fallback" style="display: none;">--</span>
    </div>
    <div class="name-banner" id="nameBanner">
      <span id="teamName" class="team-name">TEAM NAME</span>
    </div>
  </div>
</div>

<script>
  // ==========================================================================
  // FIXED: this overlay used to listen to Firebase (liveData/<screen>), but
  // the offline setup keeps everything on the local Python server and never
  // pushes to Firebase -- so the overlay received nothing and stayed blank
  // while the admin panel (which reads the local server) worked fine.
  //
  // Now it listens to the SAME local SSE stream the admin panel uses:
  //   http://127.0.0.1:5000/stream/<screen>
  // Server-Sent Events are push-based, so updates arrive instantly (no
  // polling), and there is no internet round trip at all.
  //
  // SCREEN SELECTION (this is what fixes the "dono screens confuse ho rahe"
  // problem): set it in the OBS Browser Source URL --
  //   overlay.html?screen=1   -> Screen 1 ka apna overlay
  //   overlay.html?screen=2   -> Screen 2 ka apna overlay
  // Add TWO separate Browser Sources in OBS, one with each URL. Each one
  // only ever receives its own screen's data, so they can never mix up.
  // ==========================================================================
  const SERVER = "http://127.0.0.1:5000";
  const params = new URLSearchParams(window.location.search);
  const SCREEN_ID = params.get('screen') || '1';

  let currentSlot = "";

  function getLogoPath(logoVal) {
    if (!logoVal) return "";
    if (logoVal.startsWith("http://") || logoVal.startsWith("https://") || logoVal.startsWith("data:image")) {
      return logoVal;
    }
    if (!logoVal.includes(".")) {
      return `logos/${logoVal}.png`;
    }
    return `logos/${logoVal}`;
  }

  function showSlotFallback() {
    const logoImg = document.getElementById('teamLogo');
    const slotSpan = document.getElementById('slotNumber');
    logoImg.style.display = "none";
    slotSpan.textContent = currentSlot;
    slotSpan.style.display = "block";
  }

  function renderData(data) {
    const banner = document.getElementById('banner');

    // Server pushes {} when a slot gets deactivated or cleared. Hide the
    // banner instead of leaving a stale team stuck on screen.
    if (!data || !data.name) {
      banner.style.display = "none";
      return;
    }

    const logoBox = document.getElementById('logoBox');
    const nameBanner = document.getElementById('nameBanner');
    const logoImg = document.getElementById('teamLogo');
    const slotSpan = document.getElementById('slotNumber');
    const nameSpan = document.getElementById('teamName');

    currentSlot = data.slot || "";

    const activeColor = data.sbg || data.color || '#00877a';
    const activeTextColor = data.textColor || '#ffffff';
    logoBox.style.setProperty('--theme-color', activeColor);
    nameBanner.style.setProperty('--theme-color', activeColor);
    logoBox.style.setProperty('--text-color', activeTextColor);
    nameBanner.style.setProperty('--text-color', activeTextColor);

    nameSpan.textContent = data.name;

    const logoPath = getLogoPath(data.logo);
    if (logoPath) {
      slotSpan.style.display = "none";
      logoImg.src = logoPath;
      logoImg.style.display = "block";
    } else {
      showSlotFallback();
    }

    banner.style.display = "flex";
  }

  // Same connect-with-auto-reconnect pattern the admin panel uses, so a
  // server restart doesn't permanently kill the overlay.
  function connectStream() {
    const es = new EventSource(`${SERVER}/stream/${SCREEN_ID}`);

    es.onmessage = (event) => {
      try {
        renderData(JSON.parse(event.data));
      } catch (e) {
        /* heartbeat / non-JSON keepalive -- ignore */
      }
    };

    es.onerror = () => {
      es.close();
      setTimeout(connectStream, 1500);
    };
  }

  connectStream();
</script>
</body>
</html>
