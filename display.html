<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI OFFICIAL OVERLAY - SCREEN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Agency FB', 'Oswald', sans-serif;
      font-weight: bold;
    }

    #overlay-container {
      position: absolute;
      top: 30px;
      left: 30px;
    }

    .stream-banner {
      display: flex;
      align-items: flex-start;
      position: relative;
    }

    .logo-box {
      background: var(--theme-color, #00877a);
      width: 100px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      box-sizing: border-box;
      padding: 10px;
    }

    .team-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .slot-fallback {
      color: #ffffff;
      font-size: 70px;
      font-weight: 700;
      line-height: 1;
      font-family: 'Agency FB', 'Oswald', sans-serif;
    }

    .name-banner {
      background: var(--theme-color, #00877a);
      height: 65px;
      padding: 0 45px 0 25px;
      display: flex;
      align-items: center;
      clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
      margin-left: 0px;
      z-index: 1;
    }

    .team-name {
      color: #ffffff;
      font-size: 58px;
      font-weight: 900;
      font-family: 'Agency FB', 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="overlay-container">
  <div class="stream-banner" id="banner" style="display: none;">
    <div class="logo-box" id="logoBox">
      <img id="teamLogo" class="team-logo" src="" alt="" onerror="showSlotFallback()">
      <span id="slotNumber" class="slot-fallback" style="display: none;">--</span>
    </div>
    <div class="name-banner" id="nameBanner">
      <span id="teamName" class="team-name">TEAM NAME</span>
    </div>
  </div>
</div>

<script>
  // Which screen is this overlay for? Set via the OBS Browser Source URL:
  //   overlay.html?screen=1   or   overlay.html?screen=2
  const params = new URLSearchParams(window.location.search);
  const SCREEN_ID = params.get('screen') || '1';

  const SERVER = "http://127.0.0.1:5000";
  const STREAM_URL = `${SERVER}/stream/${SCREEN_ID}`;
  const LIVE_URL = `${SERVER}/live/${SCREEN_ID}`;

  let currentSlot = "";

  function getLogoPath(logoVal) {
    if (!logoVal) return "";
    if (logoVal.startsWith("http://") || logoVal.startsWith("https://") || logoVal.startsWith("data:image")) {
      return logoVal;
    }
    if (!logoVal.includes(".")) {
      return `logos/${logoVal}.png`;
    }
    return `logos/${logoVal}`;
  }

  function showSlotFallback() {
    const logoImg = document.getElementById('teamLogo');
    const slotSpan = document.getElementById('slotNumber');
    logoImg.style.display = "none";
    slotSpan.textContent = currentSlot;
    slotSpan.style.display = "block";
  }

  function renderData(data) {
    if (!data || !data.name) return;

    const banner = document.getElementById('banner');
    const logoBox = document.getElementById('logoBox');
    const nameBanner = document.getElementById('nameBanner');
    const logoImg = document.getElementById('teamLogo');
    const slotSpan = document.getElementById('slotNumber');
    const nameSpan = document.getElementById('teamName');

    currentSlot = data.slot || "";

    const activeColor = data.sbg || '#00877a';
    logoBox.style.setProperty('--theme-color', activeColor);
    nameBanner.style.setProperty('--theme-color', activeColor);

    nameSpan.textContent = data.name;

    const logoPath = getLogoPath(data.logo);
    if (logoPath) {
      slotSpan.style.display = "none";
      logoImg.src = logoPath;
      logoImg.style.display = "block";
    } else {
      showSlotFallback();
    }

    banner.style.display = "flex";
  }

  // --- Primary path: Server-Sent Events -- server pushes the instant it
  // detects a change, so there is no polling delay at all on this side. ---
  function connectStream() {
    const es = new EventSource(STREAM_URL);
    es.onmessage = (event) => {
      try {
        renderData(JSON.parse(event.data));
      } catch (e) { /* heartbeat / ignore */ }
    };
    es.onerror = () => {
      // Server might be restarting -- close and retry, and meanwhile fall
      // back to a quick poll so the overlay doesn't just freeze.
      es.close();
      setTimeout(connectStream, 1000);
    };
  }

  // --- Fallback poll (very cheap, local loopback only) in case SSE isn't
  // available for some reason. ---
  async function pollOnce() {
    try {
      const res = await fetch(LIVE_URL);
      const data = await res.json();
      renderData(data);
    } catch (e) { /* server not up yet */ }
  }

  connectStream();
  pollOnce();
  setInterval(pollOnce, 2000); // cheap safety-net poll, SSE handles real-time updates
</script>
</body>
</html>
