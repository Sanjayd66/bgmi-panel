<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI SYNC ADMIN - OFFLINE (LOCAL SERVER)</title>
  <style>
    :root { --orange:#ff5a00; --blue:#0088ff; --green:#2ecc71; --red:#dc3545; --dark:#1a1a1a; }
    body{margin:0;font-family:'Oswald',sans-serif;background:#050505;color:#fff;overflow-x:hidden;}
    #admin{padding:20px;}
    .header { background:#000; border-left:5px solid var(--orange); padding:15px; font-size:20px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; }
    .screens-row { display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px; }
    .screen-card { background:#111; border:1px solid #333; border-radius:8px; padding:15px; }
    .screen-card h3 { margin:0 0 10px 0; color:var(--orange); }
    .screen-card .slot-big { font-size:48px; font-weight:900; }
    .screen-card .team-name-big { font-size:18px; color:#ccc; }
    .manual-row { display:flex; gap:8px; margin-top:10px; }
    .manual-row input { width:60px; }
    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
    .grid-item { background: var(--dark); border: 2px solid #333; border-radius: 8px; padding: 15px 5px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
    .grid-item.disabled-slot { opacity: 0.2; pointer-events: none; }
    .grid-item h2 { margin: 0; font-size: 32px; color: #fff; }
    .grid-item p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; text-transform: uppercase; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { padding: 10px 20px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; text-transform:uppercase; font-size:12px; }
    #import-area { width:100%; height:80px; background:#111; color:#0f0; border:1px solid #444; padding:10px; font-size:12px; margin-bottom:10px; border-radius:4px; box-sizing: border-box; }
    .settings-panel { background: #111; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #222; }
    input[type="text"], input[type="number"] { background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px; }
    input[type="text"] { width: 95%; }
  </style>
</head>
<body>

<div id="admin">
  <div class="header">
    <span>SYNC DASHBOARD (OFFLINE - LOCAL PYTHON SERVER)</span>
    <span id="liveStatus" style="color:var(--green); font-size: 14px;">CHECKING SERVER...</span>
  </div>

  <div class="screens-row" id="screensRow">
    <!-- filled in by JS: one card per screen, showing live OCR result + manual override -->
  </div>

  <div class="grid-container" id="controlGrid"></div>

  <div>
    <textarea id="import-area" placeholder="1 | TEAM NAME"></textarea>
    <div class="btn-group">
        <button class="btn" style="background:#333" onclick="importSlots()">IMPORT</button>
        <button class="btn" style="background:var(--orange)" onclick="syncToServer()">💾 SAVE TEAM DATA</button>
        <button class="btn" style="background:var(--blue)" onclick="loadFromServer()">🔄 RELOAD FROM SERVER</button>
    </div>
  </div>

  <div class="settings-panel">
    <table>
      <thead>
        <tr><th>SLOT</th><th>ACTIVE</th><th>TEAM NAME</th><th>LOGO</th></tr>
      </thead>
      <tbody id="configTable"></tbody>
    </table>
  </div>
</div>

<script>
  const SERVER = "http://127.0.0.1:5000";
  let SCREEN_IDS = []; // filled in from server config, not hardcoded

  let teamDB = {};
  let activeMap = Array(26).fill(true);
  let colors = {};

  async function checkServer() {
    try {
      const res = await fetch(`${SERVER}/`);
      const data = await res.json();
      document.getElementById('liveStatus').textContent = "SERVER CONNECTED (OFFLINE MODE)";
      document.getElementById('liveStatus').style.color = "var(--green)";
    } catch (e) {
      document.getElementById('liveStatus').textContent = "SERVER NOT RUNNING - start server.py";
      document.getElementById('liveStatus').style.color = "var(--red)";
    }
  }

  async function loadFromServer() {
    try {
      const res = await fetch(`${SERVER}/config`);
      const data = await res.json();
      teamDB = data.teamDB || {};
      activeMap = data.activeMap || Array(26).fill(true);
      colors = data.colors || {};
      init();
    } catch (e) {
      console.error("Load failed", e);
    }
  }

  async function syncToServer() {
    try {
      await fetch(`${SERVER}/config`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ teamDB, activeMap, colors })
      });
      alert("Saved to local server!");
    } catch (e) {
      alert("Save failed - is server.py running?");
    }
  }

  function init() {
    const grid = document.getElementById('controlGrid');
    const table = document.getElementById('configTable');
    grid.innerHTML = ""; table.innerHTML = "";
    for (let i = 1; i <= 25; i++) {
      if (!teamDB[i]) teamDB[i] = { name: `TEAM ${i}`, logo: `${i}` };
      const t = teamDB[i]; const on = activeMap[i];
      const color = colors[i] || "#00877a";
      grid.innerHTML += `<div class="grid-item ${on ? '' : 'disabled-slot'}" style="border-bottom: 5px solid ${color}"><h2>${i}</h2><p>${t.name}</p></div>`;
      table.innerHTML += `<tr><td><b>${i}</b></td><td><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleSlot(${i}, this.checked)" style="width:20px;"></td><td><input type="text" value="${t.name}" onchange="update(${i}, 'name', this.value)"></td><td><input type="text" value="${t.logo}" onchange="update(${i}, 'logo', this.value)"></td></tr>`;
    }
  }

  function toggleSlot(i, val) { activeMap[i] = val; init(); }
  function update(i, k, v) { teamDB[i][k] = v; init(); }

  function importSlots() {
    const text = document.getElementById('import-area').value;
    text.split('\n').forEach(line => {
      const m = line.match(/(\d+)\s*[|•-]\s*(.+)/);
      if (m) { const slot = parseInt(m[1]); if (slot >= 1 && slot <= 25) teamDB[slot].name = m[2].trim(); }
    });
    init();
  }

  // --- Per-screen live status + manual override (fallback if OCR misses) ---
  function buildScreenCards() {
    const row = document.getElementById('screensRow');
    row.innerHTML = "";
    SCREEN_IDS.forEach(sid => {
      row.innerHTML += `
        <div class="screen-card">
          <h3>SCREEN ${sid}</h3>
          <div class="slot-big" id="slotBig-${sid}">--</div>
          <div class="team-name-big" id="teamBig-${sid}">Waiting for OCR...</div>
          <div class="manual-row">
            <input type="number" id="manualInput-${sid}" min="1" max="25" placeholder="#">
            <button class="btn" style="background:var(--blue)" onclick="manualOverride('${sid}')">FORCE SET</button>
          </div>
        </div>`;
    });
  }

  function manualOverride(sid) {
    const val = document.getElementById(`manualInput-${sid}`).value;
    if (!val) return;
    fetch(`${SERVER}/manual/${sid}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slot: parseInt(val) })
    });
  }

  function connectScreenStream(sid) {
    const es = new EventSource(`${SERVER}/stream/${sid}`);
    es.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data && data.name) {
          document.getElementById(`slotBig-${sid}`).textContent = data.slot;
          document.getElementById(`teamBig-${sid}`).textContent = data.name;
        } else {
          // Empty payload -- the server just cleared this screen (e.g. the
          // slot that was showing got deactivated in the admin panel).
          // Reset the card instead of leaving the old data on screen.
          const slotEl = document.getElementById(`slotBig-${sid}`);
          const teamEl = document.getElementById(`teamBig-${sid}`);
          if (slotEl) slotEl.textContent = "--";
          if (teamEl) teamEl.textContent = "Waiting for OCR...";
        }
      } catch (e) { /* heartbeat */ }
    };
    es.onerror = () => { es.close(); setTimeout(() => connectScreenStream(sid), 1500); };
  }

  async function fetchScreenIds() {
    try {
      const res = await fetch(`${SERVER}/`);
      const data = await res.json();
      SCREEN_IDS = data.screens || [];
    } catch (e) {
      SCREEN_IDS = [];
    }
  }

  buildScreenCards();
  checkServer();
  loadFromServer();
  fetchScreenIds().then(() => {
    buildScreenCards();
    SCREEN_IDS.forEach(connectScreenStream);
  });
  setInterval(checkServer, 5000);
</script>
</body>
</html>
