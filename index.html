<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI HYBRID HIGH-ACCURACY OCR</title>
  <style>
    :root { --orange:#ff5a00; --blue:#0088ff; --green:#2ecc71; --red:#dc3545; --dark:#1a1a1a; }
    body{margin:0;font-family:sans-serif;background:#050505;color:#fff;padding:20px;}
    .ocr-box { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
    .controls { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; background: #222; padding: 10px; border-radius: 6px; }
    .btn { padding: 10px 20px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; }
    canvas { border: 2px solid var(--orange); background: #000; width: 160px; height: 90px; }
  </style>
</head>
<body>

<div class="ocr-box">
  <button class="btn" style="background:var(--green)" onclick="startOCR()">🎥 SELECT GAME SCREEN</button>
  <button class="btn" style="background:var(--red)" onclick="stopOCR()">🛑 STOP</button>

  <div class="controls">
    <label>X-Pos: <input type="range" id="posX" min="0" max="100" value="27" oninput="u()"></label>
    <label>Y-Pos: <input type="range" id="posY" min="0" max="100" value="74" oninput="u()"></label>
    <label>Width: <input type="range" id="sizeW" min="1" max="30" value="6" oninput="u()"></label>
    <label>Height: <input type="range" id="sizeH" min="1" max="30" value="7" oninput="u()"></label>
    <label>Threshold: <input type="range" id="sens" min="100" max="255" value="190" oninput="u()"></label>
  </div>

  <div style="display:flex; gap:20px; margin-top:15px; align-items:center;">
    <canvas id="prevCanvas"></canvas>
    <canvas id="procCanvas"></canvas>
    <div>
      <div>Status: <span id="ocrStatus">Stopped</span></div>
      <div>Detected Slot: <h1 id="detectedSlot" style="color:var(--orange); margin:0;">--</h1></div>
    </div>
  </div>
</div>

<video id="videoFeed" autoplay style="display:none;"></video>

<script>
  let ocrInterval = null;

  function u(){
    // Utility UI handler
  }

  // Pure Geometric Segment Matrix Matcher (Optimized for BGMI Esports Font)
  function decodeBGMIDigit(grid, startX, endX, h) {
    let w = endX - startX + 1;
    if (w <= 0) return "";
    
    let ratio = w / h;
    if (ratio < 0.38) return "1"; // '1' is distinctively narrow

    let top = 0, mid = Math.floor(h / 2), bot = h - 1;
    let tL = 0, tR = 0, mL = 0, mR = 0, bL = 0, bR = 0;

    for (let y = 0; y < h; y++) {
      for (let x = startX; x <= endX; x++) {
        if (grid[y][x]) {
          let isLeft = x < (startX + w / 2);
          if (y < mid) {
            if (isLeft) tL++; else tR++;
          } else if (y > mid) {
            if (isLeft) bL++; else bR++;
          } else {
            if (isLeft) mL++; else mR++;
          }
        }
      }
    }

    // BGMI Font Matrix Rules
    if (tL > 2 && tR > 2 && bL > 2 && bR > 2 && (mL + mR) < 2) return "0";
    if (tL < 2 && tR > 2 && bL > 2 && bR < 2) return "2";
    if (tL < 2 && tR > 2 && bL < 2 && bR > 2) return "3";
    if (tL > 2 && tR > 2 && bL < 2 && bR > 2 && (mL + mR) > 2) return "4";
    if (tL > 2 && tR < 2 && bL < 2 && bR > 2) return "5";
    if (tL > 2 && tR < 2 && bL > 2 && bR > 2) return "6";
    if (tR > 2 && bR > 2 && tL < 2) return "7";
    if (tL > 2 && tR > 2 && bL > 2 && bR > 2 && (mL + mR) > 2) return "8";
    if (tL > 2 && tR > 2 && bL < 2 && bR > 2) return "9";

    return "";
  }

  function parseCrop(srcCanvas, procCanvas) {
    const ctx = procCanvas.getContext('2d');
    const w = 60, h = 40;
    procCanvas.width = w; procCanvas.height = h;

    ctx.drawImage(srcCanvas, 0, 0, w, h);
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const thresh = parseInt(document.getElementById('sens').value);

    let grid = Array(h).fill(0).map(() => Array(w).fill(0));

    // Binarization
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let i = (y * w + x) * 4;
        let brightness = (d[i] + d[i+1] + d[i+2]) / 3;
        if (brightness >= thresh) {
          grid[y][x] = 1;
          d[i] = 255; d[i+1] = 255; d[i+2] = 255;
        } else {
          grid[y][x] = 0;
          d[i] = 0; d[i+1] = 0; d[i+2] = 0;
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);

    // Column Projection to Split Digits
    let colActive = Array(w).fill(false);
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) {
        if (grid[y][x]) { colActive[x] = true; break; }
      }
    }

    let bounds = [];
    let inBlock = false, sX = 0;
    for (let x = 0; x < w; x++) {
      if (colActive[x] && !inBlock) { inBlock = true; sX = x; }
      else if (!colActive[x] && inBlock) {
        inBlock = false;
        if (x - sX >= 2) bounds.push({ startX: sX, endX: x - 1 });
      }
    }
    if (inBlock) bounds.push({ startX: sX, endX: w - 1 });

    let finalStr = "";
    bounds.forEach(b => {
      finalStr += decodeBGMIDigit(grid, b.startX, b.endX, h);
    });

    return parseInt(finalStr, 10);
  }

  async function startOCR() {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const video = document.getElementById('videoFeed');
      video.srcObject = stream;
      document.getElementById('ocrStatus').textContent = "Active";

      const pCan = document.getElementById('prevCanvas');
      const pCtx = pCan.getContext('2d');
      const procCan = document.getElementById('procCanvas');

      ocrInterval = setInterval(() => {
        if (!video.videoWidth) return;

        const vx = video.videoWidth * (parseInt(document.getElementById('posX').value) / 100);
        const vy = video.videoHeight * (parseInt(document.getElementById('posY').value) / 100);
        const vw = video.videoWidth * (parseInt(document.getElementById('sizeW').value) / 100);
        const vh = video.videoHeight * (parseInt(document.getElementById('sizeH').value) / 100);

        pCan.width = vw; pCan.height = vh;
        pCtx.drawImage(video, vx, vy, vw, vh, 0, 0, vw, vh);

        let res = parseCrop(pCan, procCan);
        if (!isNaN(res) && res >= 1 && res <= 25) {
          document.getElementById('detectedSlot').textContent = res;
        }
      }, 100);
    } catch(e) {
      alert(e);
    }
  }

  function stopOCR() {
    if(ocrInterval) clearInterval(ocrInterval);
    document.getElementById('ocrStatus').textContent = "Stopped";
  }
</script>
</body>
</html>
