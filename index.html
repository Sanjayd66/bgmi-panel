<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYNC DASHBOARD - Interactive Drag OCR</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
        input[type="text"] { background: #222; color: #00ffcc; border: 1px solid #444; padding: 8px; width: 280px; }
        button { background: #28a745; color: white; border: none; padding: 9px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.stop { background: #dc3545; }
        
        .workspace { display: flex; gap: 20px; margin-top: 15px; }
        .video-container { position: relative; border: 2px solid #333; display: inline-block; background: #000; }
        video { display: block; max-width: 640px; height: auto; }
        canvas#selectionCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
        
        .preview-box { background: #1e1e1e; padding: 15px; border-radius: 6px; width: 250px; }
        canvas#cropCanvas { border: 1px solid #ff9900; margin-top: 10px; background: #000; width: 100%; }
        .slot-display { font-size: 28px; font-weight: bold; color: #00ffcc; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>SYNC DASHBOARD (PC & MOBILE + AUTO OCR)</h2>

    <div class="controls">
        <label>OCR Server URL:</label>
        <input type="text" id="serverUrl" value="http://127.0.0.1:5000/ocr">
        <button onclick="startScreenShare()">📹 SELECT GAME SCREEN</button>
        <button class="stop" onclick="stopOCR()">🔴 STOP OCR</button>
    </div>

    <p style="color: #aaa; font-size: 14px;">💡 <b>Tip:</b> Game screen select karne ke baad video par **Mouse se drag (click & hold)** karke slot count waala box select karein.</p>

    <div class="workspace">
        <div class="video-container">
            <video id="gameVideo" autoplay playsinline></video>
            <canvas id="selectionCanvas"></canvas>
        </div>

        <div class="preview-box">
            <h4>Raw Stream Crop:</h4>
            <canvas id="cropCanvas"></canvas>
            <div>OCR Status: <span id="ocrStatus" style="color: #ff9900;">Idle</span></div>
            <div class="slot-display">Detected Slot: <span id="detectedSlot">--</span></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('gameVideo');
        const selCanvas = document.getElementById('selectionCanvas');
        const selCtx = selCanvas.getContext('2d');
        const cropCanvas = document.getElementById('cropCanvas');
        const cropCtx = cropCanvas.getContext('2d');

        let isDragging = false;
        let startX = 0, startY = 0;
        let cropArea = { x: 50, y: 50, width: 100, height: 100 }; // default box
        let ocrInterval = null;

        async function startScreenShare() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    selCanvas.width = video.clientWidth;
                    selCanvas.height = video.clientHeight;
                    drawSelection();
                    startOCRProcessing();
                };
            } catch (err) {
                console.error("Screen Share Error: ", err);
            }
        }

        // Mouse Drag to Select Box
        selCanvas.addEventListener('mousedown', (e) => {
            const rect = selCanvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDragging = true;
        });

        selCanvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = selCanvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            cropArea.x = Math.min(startX, currentX);
            cropArea.y = Math.min(startY, currentY);
            cropArea.width = Math.abs(currentX - startX);
            cropArea.height = Math.abs(currentY - startY);

            drawSelection();
        });

        selCanvas.addEventListener('mouseup', () => { isDragging = false; });

        function drawSelection() {
            selCtx.clearRect(0, 0, selCanvas.width, selCanvas.height);
            selCtx.strokeStyle = '#00ffcc';
            selCtx.lineWidth = 2;
            selCtx.fillStyle = 'rgba(0, 255, 204, 0.2)';
            
            selCtx.fillRect(cropArea.x, cropArea.y, cropArea.width, cropArea.height);
            selCtx.strokeRect(cropArea.x, cropArea.y, cropArea.width, cropArea.height);
        }

        function captureCroppedFrame() {
            if (!video.videoWidth || cropArea.width === 0 || cropArea.height === 0) return null;

            const scaleX = video.videoWidth / video.clientWidth;
            const scaleY = video.videoHeight / video.clientHeight;

            const realX = cropArea.x * scaleX;
            const realY = cropArea.y * scaleY;
            const realW = cropArea.width * scaleX;
            const realH = cropArea.height * scaleY;

            cropCanvas.width = realW;
            cropCanvas.height = realH;

            cropCtx.drawImage(video, realX, realY, realW, realH, 0, 0, realW, realH);
            return cropCanvas.toDataURL('image/jpeg', 0.9);
        }

        function startOCRProcessing() {
            if (ocrInterval) clearInterval(ocrInterval);
            document.getElementById('ocrStatus').innerText = "OCR Active...";

            ocrInterval = setInterval(async () => {
                const imgData = captureCroppedFrame();
                if (!imgData) return;

                const url = document.getElementById('serverUrl').value;

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imgData })
                    });
                    const data = await res.json();

                    if (data.success && data.slot !== null) {
                        document.getElementById('detectedSlot').innerText = data.slot;
                        highlightSlotOnDashboard(data.slot);
                    }
                } catch (e) {
                    document.getElementById('ocrStatus').innerText = "Server Error!";
                }
            }, 800);
        }

        function stopOCR() {
            if (ocrInterval) clearInterval(ocrInterval);
            document.getElementById('ocrStatus').innerText = "Stopped";
        }

        function highlightSlotOnDashboard(slotNum) {
            // Your active card glow/highlight logic here
            console.log("Active Slot detected: ", slotNum);
        }
    </script>
</body>
</html>
