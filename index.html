<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI PRO SYNC ADMIN - CUSTOM PIXEL OCR</title>
  <style>
    :root { --orange:#ff5a00; --blue:#0088ff; --green:#2ecc71; --red:#dc3545; --dark:#1a1a1a; }
    body{margin:0;font-family:'Oswald',sans-serif;background:#050505;color:#fff;overflow-x:hidden;}
    #admin{padding:20px;}
    .header { background:#000; border-left:5px solid var(--orange); padding:15px; font-size:20px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; }
    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
    .grid-item { background: var(--dark); border: 2px solid #333; border-radius: 8px; padding: 15px 5px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
    .grid-item.active-slot { border-color: white; box-shadow: 0 0 15px rgba(255,255,255,0.5); }
    .grid-item.disabled-slot { opacity: 0.2; pointer-events: none; }
    .grid-item h2 { margin: 0; font-size: 32px; color: #fff; }
    .grid-item p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; text-transform: uppercase; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { padding: 10px 20px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; text-transform:uppercase; font-size:12px; }
    #import-area { width:100%; height:80px; background:#111; color:#0f0; border:1px solid #444; padding:10px; font-size:12px; margin-bottom:10px; border-radius:4px; box-sizing: border-box; }
    .settings-panel { background: #111; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #333; }
    .hide-ui { display: none !important; }
    #showSettings { display:none; position:fixed; top:10px; right:10px; z-index:1000; background: var(--green); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #222; }
    input { background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px; width: 95%; }
    
    .ocr-box { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
    .controls-grid { display: flex; gap: 15px; align-items: center; margin-top: 10px; flex-wrap: wrap; background: #222; padding: 10px; border-radius: 6px; }
    .controls-grid label { font-size: 12px; color: #ccc; }
    .controls-grid input[type="range"] { width: 100px; }
    #previewCanvas, #procCanvas { border: 2px solid var(--orange); background: #000; width: 160px; height: 90px; object-fit: contain; image-rendering: pixelated; }
  </style>
</head>
<body>

<button id="showSettings" class="btn" onclick="toggleUI(false)">SHOW SETTINGS</button>

<div id="admin">
  <div class="header">
    <span>SYNC DASHBOARD (CUSTOM NATIVE OCR)</span>
    <span id="liveStatus" style="color:var(--green); font-size: 14px;">READY</span>
  </div>

  <div class="ocr-box">
    <div>
      <button class="btn" style="background:var(--green)" onclick="startOCR()">🎥 1. SELECT GAME SCREEN</button>
      <button class="btn" style="background:var(--red)" onclick="stopOCR()">🛑 STOP</button>
    </div>

    <div class="controls-grid">
      <div>
        <label>Left/Right (X): <b id="valX">26%</b></label><br>
        <input type="range" id="posX" min="0" max="100" value="26" oninput="updateCropParams()">
      </div>
      <div>
        <label>Top/Down (Y): <b id="valY">73%</b></label><br>
        <input type="range" id="posY" min="0" max="100" value="73" oninput="updateCropParams()">
      </div>
      <div>
        <label>Box Width: <b id="valW">6%</b></label><br>
        <input type="range" id="sizeW" min="1" max="30" value="6" oninput="updateCropParams()">
      </div>
      <div>
        <label>Box Height: <b id="valH">7%</b></label><br>
        <input type="range" id="sizeH" min="1" max="30" value="7" oninput="updateCropParams()">
      </div>
      <div>
        <label>Color Sensitivity: <b id="valSens">40</b></label><br>
        <input type="range" id="sens" min="10" max="100" value="40" oninput="updateCropParams()">
      </div>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 15px; align-items: center;">
      <div>
        <div style="font-size: 11px; color:#aaa;">Raw Game Stream:</div>
        <canvas id="previewCanvas"></canvas>
      </div>
      <div>
        <div style="font-size: 11px; color:var(--green);">Isolated Text Mask:</div>
        <canvas id="procCanvas"></canvas>
      </div>
      <div style="font-size: 14px;">
        <div><b>Status:</b> <span id="ocrStatus">Disabled</span></div>
        <div><b>Detected Slot:</b> <span id="detectedSlot" style="color:var(--orange); font-size: 32px; font-weight:bold;">--</span></div>
      </div>
    </div>
  </div>

  <div class="grid-container" id="controlGrid"></div>

  <div class="settings-area">
    <textarea id="import-area" placeholder="1 | TEAM NAME"></textarea>
    <div class="btn-group">
        <button class="btn" style="background:#333" onclick="importSlots()">IMPORT</button>
        <button class="btn" style="background:var(--orange)" onclick="syncToCloud()">☁️ SYNC TO CLOUD (SAVE)</button>
        <button class="btn" style="background:var(--blue)" onclick="loadFromCloud()">🔄 LOAD FROM CLOUD</button>
        <button class="btn" style="background:var(--red)" onclick="toggleUI(true)">CAST MODE</button>
    </div>
  </div>

  <div class="settings-panel settings-area">
    <table>
      <thead>
        <tr><th>SLOT</th><th>ACTIVE</th><th>TEAM NAME</th><th>LOGO</th></tr>
      </thead>
      <tbody id="configTable"></tbody>
    </table>
  </div>
</div>

<video id="videoFeed" autoplay style="display:none;"></video>

<script>
  const LIVE_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/liveData.json";
  const CONFIG_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/configData.json";

  const fixedColors = {
    1: '#10449e', 2: '#1b5e20', 3: '#c62828', 4: '#e65100', 5: '#6a1b9a',
    6: '#2ecc71', 7: '#ad1457', 8: '#00796b', 9: '#795548', 10: '#303f9f',
    11: '#fbc02d', 12: '#1565c0', 13: '#388e3c', 14: '#ff8f00', 15: '#d81b60',
    16: '#7b1fa2', 17: '#00897b', 18: '#9e9e9e', 19: '#558b2f', 20: '#5d4037',
    21: '#0277bd', 22: '#616161', 23: '#ff5722', 24: '#7cb342', 25: '#263238'
  };

  let teamDB = JSON.parse(localStorage.getItem('bgmi_v23_db') || '{}');
  let activeMap = JSON.parse(localStorage.getItem('bgmi_active_map') || '[]');
  if(activeMap.length === 0) activeMap = Array(26).fill(true);

  let ocrInterval = null;
  let lastActiveSlot = null;

  function syncToCloud() {
    const data = { teamDB, activeMap };
    fetch(CONFIG_URL, { method: "PUT", body: JSON.stringify(data) }).then(() => alert("Saved!"));
  }

  function loadFromCloud() {
    fetch(CONFIG_URL).then(r => r.json()).then(data => {
      if(data) {
        teamDB = data.teamDB; activeMap = data.activeMap;
        localStorage.setItem('bgmi_v23_db', JSON.stringify(teamDB));
        localStorage.setItem('bgmi_active_map', JSON.stringify(activeMap));
        init();
      }
    });
  }

  function init() {
    const grid = document.getElementById('controlGrid');
    const table = document.getElementById('configTable');
    grid.innerHTML = ""; table.innerHTML = "";
    for(let i=1; i<=25; i++) {
      if(!teamDB[i]) teamDB[i] = { name: `TEAM ${i}`, logo: `${i}` };
      const t = teamDB[i]; const on = activeMap[i];
      grid.innerHTML += `<div class="grid-item ${on ? '' : 'disabled-slot'}" id="slot-${i}" onclick="sendData(${i})" style="border-bottom: 5px solid ${fixedColors[i]}"><h2>${i}</h2><p>${t.name}</p></div>`;
      table.innerHTML += `<tr><td><b>${i}</b></td><td><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleSlot(${i}, this.checked)" style="width:20px;"></td><td><input value="${t.name}" onchange="update(${i}, 'name', this.value)"></td><td><input value="${t.logo}" onchange="update(${i}, 'logo', this.value)"></td></tr>`;
    }
  }

  function toggleSlot(i, val) { activeMap[i] = val; localStorage.setItem('bgmi_active_map', JSON.stringify(activeMap)); init(); }
  function update(i, k, v) { teamDB[i][k] = v; localStorage.setItem('bgmi_v23_db', JSON.stringify(teamDB)); init(); }

  function importSlots(){
    const text=document.getElementById('import-area').value;
    text.split('\n').forEach(line=>{
      const m=line.match(/(\d+)\s*[|•-]\s*(.+)/);
      if(m){ const slot = parseInt(m[1]); if(slot>=1 && slot<=25) teamDB[slot].name = m[2].trim(); }
    });
    localStorage.setItem('bgmi_v23_db',JSON.stringify(teamDB)); init();
  }

  function toggleUI(hide) {
    document.querySelectorAll('.settings-area').forEach(el => el.classList.toggle('hide-ui', hide));
    document.getElementById('showSettings').style.display = hide ? 'block' : 'none';
  }

  function sendData(slot) {
    if(!activeMap[slot]) return;
    const t = teamDB[slot];
    const payload = {slot, name:t.name, logo:t.logo, sbg:fixedColors[slot], ts:Date.now()};
    fetch(LIVE_URL, {method:"PUT", body:JSON.stringify(payload)});
    document.getElementById('liveStatus').textContent = `LIVE: SLOT ${slot} - ${t.name}`;
    
    document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('active-slot'));
    const activeElem = document.getElementById(`slot-${slot}`);
    if(activeElem) activeElem.classList.add('active-slot');
  }

  function updateCropParams() {
    document.getElementById('valX').textContent = document.getElementById('posX').value + '%';
    document.getElementById('valY').textContent = document.getElementById('posY').value + '%';
    document.getElementById('valW').textContent = document.getElementById('sizeW').value + '%';
    document.getElementById('valH').textContent = document.getElementById('sizeH').value + '%';
    document.getElementById('valSens').textContent = document.getElementById('sens').value;
  }

  // --- NATIVE CUSTOM DIGIT RECOGNIZER ENGINE ---
  function processCustomOCR(srcCanvas, targetCanvas) {
    const ctx = targetCanvas.getContext('2d');
    const w = 60, h = 40;
    targetCanvas.width = w;
    targetCanvas.height = h;

    ctx.drawImage(srcCanvas, 0, 0, w, h);
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const sens = parseInt(document.getElementById('sens').value);

    // Step 1: Contrast isolation (White Digits Extraction)
    let grid = Array(h).fill(0).map(() => Array(w).fill(0));
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        
        // Match pure white text relative to background
        if (r > 200 && g > 200 && b > 200 && (Math.abs(r-g) < 15)) {
          grid[y][x] = 1;
          data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
        } else {
          grid[y][x] = 0;
          data[idx] = 0; data[idx+1] = 0; data[idx+2] = 0;
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);

    // Step 2: Vertical projection to separate left and right digits
    let colCounts = Array(w).fill(0);
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) {
        if (grid[y][x] === 1) colCounts[x]++;
      }
    }

    let digitBlocks = [];
    let inDigit = false, startX = 0;
    for (let x = 0; x < w; x++) {
      if (colCounts[x] >= 3 && !inDigit) { inDigit = true; startX = x; }
      else if (colCounts[x] < 3 && inDigit) {
        inDigit = false;
        if (x - startX >= 3) digitBlocks.push({ startX, endX: x - 1 });
      }
    }
    if (inDigit && (w - startX >= 3)) digitBlocks.push({ startX, endX: w - 1 });

    if (digitBlocks.length === 0) return null;

    // Helper: Identify individual digit shape (0-9) using structural features
    function recognizeDigit(b) {
      let dW = b.endX - b.startX + 1;
      let topY = 0, botY = h - 1;
      
      for (let y = 0; y < h; y++) {
        let has = false;
        for (let x = b.startX; x <= b.endX; x++) if (grid[y][x] === 1) has = true;
        if (has) { topY = y; break; }
      }
      for (let y = h - 1; y >= 0; y--) {
        let has = false;
        for (let x = b.startX; x <= b.endX; x++) if (grid[y][x] === 1) has = true;
        if (has) { botY = y; break; }
      }

      let dH = botY - topY + 1;
      let midY = Math.floor((topY + botY) / 2);
      let midX = Math.floor((b.startX + b.endX) / 2);

      // Aspect Ratio Check for '1'
      if (dW <= 8 || (dH / dW > 2.2)) return 1;

      // Sample structural regions
      let topRow = 0, midRow = 0, botRow = 0;
      let topL = 0, topR = 0, botL = 0, botR = 0;

      for (let x = b.startX; x <= b.endX; x++) {
        if (grid[topY + 1][x]) topRow++;
        if (grid[midY][x]) midRow++;
        if (grid[botY - 1][x]) botRow++;
      }

      for (let y = topY; y < midY; y++) {
        if (grid[y][b.startX]) topL++;
        if (grid[y][b.endX]) topR++;
      }
      for (let y = midY; y <= botY; y++) {
        if (grid[y][b.startX]) botL++;
        if (grid[y][b.endX]) botR++;
      }

      // Feature matching rules
      if (midRow > 2 && topL === 0 && botR === 0) return 2;
      if (midRow > 2 && topL === 0 && botL === 0) return 3;
      if (topRow < 2 && midRow > 2) return 4;
      if (midRow > 2 && topR === 0 && botL === 0) return 5;
      if (midRow > 2 && topR === 0 && botL > 1) return 6;
      if (topRow > 2 && topL === 0 && botL === 0) return 7;
      if (topL > 1 && topR > 1 && botL > 1 && botR > 1 && midRow > 2) return 8;
      if (topL > 1 && topR > 1 && botL === 0 && midRow > 2) return 9;
      if (topL > 1 && topR > 1 && botL > 1 && botR > 1 && midRow <= 2) return 0;

      return 1; // Default fallback
    }

    let detectedStr = "";
    digitBlocks.forEach(block => {
      detectedStr += recognizeDigit(block);
    });

    return parseInt(detectedStr, 10);
  }

  async function startOCR() {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const video = document.getElementById('videoFeed');
      video.srcObject = stream;

      document.getElementById('ocrStatus').textContent = "Scanning Active...";

      const prevCanvas = document.getElementById('previewCanvas');
      const prevCtx = prevCanvas.getContext('2d');
      const procCanvas = document.getElementById('procCanvas');

      ocrInterval = setInterval(() => {
        if (video.videoWidth === 0) return;

        const pX = parseInt(document.getElementById('posX').value) / 100;
        const pY = parseInt(document.getElementById('posY').value) / 100;
        const sW = parseInt(document.getElementById('sizeW').value) / 100;
        const sH = parseInt(document.getElementById('sizeH').value) / 100;

        const vx = video.videoWidth * pX;
        const vy = video.videoHeight * pY;
        const vw = video.videoWidth * sW;
        const vh = video.videoHeight * sH;

        prevCanvas.width = vw;
        prevCanvas.height = vh;
        prevCtx.drawImage(video, vx, vy, vw, vh, 0, 0, vw, vh);

        // Run Native Feature Analysis OCR
        const detectedNum = processCustomOCR(prevCanvas, procCanvas);
        
        if (detectedNum && detectedNum >= 1 && detectedNum <= 25) {
          document.getElementById('detectedSlot').textContent = detectedNum;
          if (detectedNum !== lastActiveSlot) {
            lastActiveSlot = detectedNum;
            sendData(detectedNum);
          }
        }
      }, 250); // Fast 250ms interval

    } catch (err) {
      alert("Screen capture error: " + err);
      document.getElementById('ocrStatus').textContent = "Failed";
    }
  }

  function stopOCR() {
    if (ocrInterval) clearInterval(ocrInterval);
    document.getElementById('ocrStatus').textContent = "Stopped";
    const video = document.getElementById('videoFeed');
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
    }
  }

  init();
  loadFromCloud();
</script>
</body>
</html>
