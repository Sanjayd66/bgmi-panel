<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYNC DASHBOARD (PC & MOBILE + AUTO OCR)</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; margin: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .input-group { display: flex; align-items: center; gap: 10px; }
        input[type="text"] { background: #000; border: 1px solid #333; color: #00ff66; padding: 8px; border-radius: 4px; width: 250px; }
        button { padding: 10px 15px; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-green { background: #00b37e; color: #fff; }
        .btn-red { background: #e53e3e; color: #fff; }
        .container { display: flex; gap: 20px; margin-bottom: 20px; }
        .video-box { background: #1e1e1e; padding: 10px; border-radius: 8px; width: 450px; }
        .status-box { background: #1e1e1e; padding: 15px; border-radius: 8px; flex-grow: 1; }
        video, canvas { width: 100%; border-radius: 4px; }
        .crop-preview { border: 2px solid #ff9900; width: 120px; height: 120px; margin-top: 10px; }
        .detected-text { color: #ff9900; font-size: 22px; font-weight: bold; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2d2d2d; font-size: 13px; }
        th { background: #181818; color: #888; text-transform: uppercase; }
        .tbl-input { width: 95%; background: #000; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>SYNC DASHBOARD (PC & MOBILE + AUTO OCR)</h2>
        <span style="color: #00ff66; font-weight: bold;">READY</span>
    </div>

    <div class="header" style="justify-content: flex-start; gap: 15px;">
        <span>OCR Server URL:</span>
        <input type="text" id="serverUrl" value="http://127.0.0.1:5000/ocr">
        <button class="btn-green" onclick="startScreenCapture()">📷 SELECT GAME SCREEN</button>
        <button class="btn-red" onclick="stopOCR()">🛑 STOP OCR</button>
    </div>

    <div class="container">
        <div class="video-box">
            <video id="gameVideo" autoplay playsinline muted></video>
            <canvas id="cropCanvas" style="display:none;"></canvas>
        </div>
        <div class="status-box">
            <div>Raw Stream Crop:</div>
            <img id="cropPreview" class="crop-preview" src="" alt="Crop Area">
            <div style="margin-top: 10px; color: #00ff66;" id="ocrStatus">OCR Status: Idle</div>
            <div class="detected-text">Detected Slot: <span id="detectedSlot">--</span></div>
        </div>
    </div>

    <h3>SLOT ADMIN PANEL</h3>
    <table>
        <thead>
            <tr>
                <th style="width: 50px;">SLOT</th>
                <th style="width: 60px;">ACTIVE</th>
                <th>TEAM NAME (ADMIN INFO)</th>
                <th>GFX / IMAGE LINK</th>
            </tr>
        </thead>
        <tbody id="slotTableBody">
        </tbody>
    </table>

    <script>
        let videoStream = null;
        let ocrInterval = null;

        // Populate 25 Slots
        const tbody = document.getElementById('slotTableBody');
        for (let i = 1; i <= 25; i++) {
            const isLocked = i <= 4;
            tbody.innerHTML += `
                <tr>
                    <td><b>${i}</b></td>
                    <td><input type="checkbox" id="active_${i}" ${isLocked ? '' : 'checked'}></td>
                    <td><input type="text" class="tbl-input" id="team_${i}" value="${isLocked ? '• LOCKED 🔒' : 'TEAM ' + i}"></td>
                    <td><input type="text" class="tbl-input" id="gfx_${i}" placeholder="Image Direct Link"></td>
                </tr>
            `;
        }

        async function startScreenCapture() {
            try {
                videoStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const video = document.getElementById('gameVideo');
                video.srcObject = videoStream;
                document.getElementById('ocrStatus').innerText = "OCR Status: OCR Active...";
                
                if(ocrInterval) clearInterval(ocrInterval);
                ocrInterval = setInterval(captureAndSend, 1000);
            } catch (err) {
                alert("Screen Selection Cancelled");
            }
        }

        function stopOCR() {
            if(ocrInterval) clearInterval(ocrInterval);
            if(videoStream) videoStream.getTracks().forEach(track => track.stop());
            document.getElementById('ocrStatus').innerText = "OCR Status: Stopped";
        }

        async function captureAndSend() {
            const video = document.getElementById('gameVideo');
            if (!video.videoWidth) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // BGMI Spectator Slot Box Crop Coordinates
            const cropX = video.videoWidth * 0.138;
            const cropY = video.videoHeight * 0.815;
            const cropW = video.videoWidth * 0.032;
            const cropH = video.videoHeight * 0.050;

            canvas.width = cropW;
            canvas.height = cropH;

            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            document.getElementById('cropPreview').src = dataUrl;

            const serverUrl = document.getElementById('serverUrl').value;

            try {
                const res = await fetch(serverUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });
                const data = await res.json();
                if(data.success && data.slot) {
                    document.getElementById('detectedSlot').innerText = data.slot;
                } else {
                    document.getElementById('detectedSlot').innerText = "--";
                }
            } catch (e) {
                console.error("OCR Request Error:", e);
            }
        }
    </script>
</body>
</html>
