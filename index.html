<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BGMI PRO SYNC ADMIN - PYTHON CAPTURE (ONLINE)</title>
  <style>
    :root { --orange:#ff5a00; --blue:#0088ff; --green:#2ecc71; --red:#dc3545; --dark:#1a1a1a; }
    body{margin:0;font-family:'Oswald',sans-serif;background:#050505;color:#fff;overflow-x:hidden;}
    #admin{padding:20px;}
    .header { background:#000; border-left:5px solid var(--orange); padding:15px; font-size:20px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; }
    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
    .grid-item { background: var(--dark); border: 2px solid #333; border-radius: 8px; padding: 15px 5px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
    .grid-item.active-slot-1 { border-color: var(--blue); box-shadow: 0 0 15px rgba(0,136,255,0.6); }
    .grid-item.active-slot-2 { border-color: var(--orange); box-shadow: 0 0 15px rgba(255,90,0,0.6); }
    .grid-item.disabled-slot { opacity: 0.2; pointer-events: none; }
    .grid-item h2 { margin: 0; font-size: 32px; color: #fff; }
    .grid-item p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; text-transform: uppercase; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { padding: 10px 20px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; text-transform:uppercase; font-size:12px; }
    #import-area { width:100%; height:80px; background:#111; color:#0f0; border:1px solid #444; padding:10px; font-size:12px; margin-bottom:10px; border-radius:4px; box-sizing: border-box; }
    .settings-panel { background: #111; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #333; }
    .hide-ui { display: none !important; }
    #showSettings { display:none; position:fixed; top:10px; right:10px; z-index:1000; background: var(--green); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #222; }
    input[type="text"] { background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px; width: 95%; }

    .engine-status { background:#111; padding:15px; border-radius:8px; border:1px solid #333; margin-bottom:20px; display:flex; gap:30px; flex-wrap:wrap; }
    .engine-status .col b { color:#888; font-size:11px; text-transform:uppercase; display:block; }
    .engine-status .col span.val { font-size:18px; font-weight:bold; }

    .target-select { display:flex; align-items:center; gap:8px; margin-bottom:15px; background:#111; padding:10px; border-radius:8px; }
  </style>
</head>
<body>

<button id="showSettings" class="btn" onclick="toggleUI(false)">SHOW SETTINGS</button>

<div id="admin">
  <div class="header">
    <span>SYNC DASHBOARD (PYTHON CAPTURE + FIREBASE - ONLINE)</span>
    <span id="liveStatus" style="color:var(--green); font-size: 14px;">READY</span>
  </div>

  <!-- No browser screen-share here anymore -- server.py captures both
       screens itself. This just shows whether that engine is reachable
       and what it's currently seeing, for your peace of mind. -->
  <div class="engine-status settings-area">
    <div class="col">
      <b>Python Engine</b>
      <span class="val" id="engineStatus" style="color:var(--red)">Checking...</span>
    </div>
    <div class="col">
      <b>Screen 1 Live</b>
      <span class="val" id="live1" style="color:var(--blue)">--</span>
    </div>
    <div class="col">
      <b>Screen 2 Live</b>
      <span class="val" id="live2" style="color:var(--orange)">--</span>
    </div>
  </div>

  <div class="target-select settings-area">
    <b>Manual click target:</b>
    <label><input type="radio" name="manualTarget" value="1" checked onchange="manualTarget=1"> Screen 1</label>
    <label><input type="radio" name="manualTarget" value="2" onchange="manualTarget=2"> Screen 2</label>
    <span style="color:#888; font-size:12px;">(clicking a team below sends it live to whichever screen is selected here)</span>
  </div>

  <div class="grid-container" id="controlGrid"></div>

  <div class="settings-area">
    <textarea id="import-area" placeholder="1 | TEAM NAME"></textarea>
    <div class="btn-group">
        <button class="btn" style="background:#333" onclick="importSlots()">IMPORT</button>
        <button class="btn" style="background:var(--orange)" onclick="syncToCloud()">☁️ SYNC TO CLOUD (SAVE)</button>
        <button class="btn" style="background:var(--blue)" onclick="loadFromCloud()">🔄 LOAD FROM CLOUD</button>
        <button class="btn" style="background:var(--red)" onclick="toggleUI(true)">CAST MODE</button>
    </div>
  </div>

  <div class="settings-panel settings-area">
    <table>
      <thead>
        <tr><th>SLOT</th><th>ACTIVE</th><th>TEAM NAME</th><th>LOGO</th></tr>
      </thead>
      <tbody id="configTable"></tbody>
    </table>
  </div>
</div>

<script>
  // Same Firebase paths/keys as your original admin panel -- team data
  // (configData) is untouched, and server.py now reads it directly too, so
  // there's nothing extra to sync. liveData is split per-screen since
  // there are 2 game screens now.
  const CONFIG_URL = "https://bgmi-overlay-default-rtdb.firebaseio.com/configData.json";
  const liveUrl = (screenId) => `https://bgmi-overlay-default-rtdb.firebaseio.com/liveData/${screenId}.json`;

  const fixedColors = {
    1: '#10449e', 2: '#1b5e20', 3: '#c62828', 4: '#e65100', 5: '#6a1b9a',
    6: '#2ecc71', 7: '#ad1457', 8: '#00796b', 9: '#795548', 10: '#303f9f',
    11: '#fbc02d', 12: '#1565c0', 13: '#388e3c', 14: '#ff8f00', 15: '#d81b60',
    16: '#7b1fa2', 17: '#00897b', 18: '#9e9e9e', 19: '#558b2f', 20: '#5d4037',
    21: '#0277bd', 22: '#616161', 23: '#ff5722', 24: '#7cb342', 25: '#263238'
  };

  let teamDB = JSON.parse(localStorage.getItem('bgmi_v23_db') || '{}');
  let activeMap = JSON.parse(localStorage.getItem('bgmi_active_map') || '[]');
  if (activeMap.length === 0) activeMap = Array(26).fill(true);

  let manualTarget = 1; // which screen a manual grid click sends to

  async function syncToCloud() {
    const data = { teamDB, activeMap };
    try {
      await fetch(CONFIG_URL, { method: "PUT", body: JSON.stringify(data) });
      alert("Cloud par save ho gaya! (Python engine ~5 sec me isko utha lega)");
    } catch (e) { alert("Sync failed!"); }
  }

  async function loadFromCloud() {
    try {
      const res = await fetch(CONFIG_URL);
      const data = await res.json();
      if (data) {
        teamDB = data.teamDB;
        activeMap = data.activeMap;
        localStorage.setItem('bgmi_v23_db', JSON.stringify(teamDB));
        localStorage.setItem('bgmi_active_map', JSON.stringify(activeMap));
        init();
      }
    } catch (e) { console.error("Load failed"); }
  }

  function init() {
    const grid = document.getElementById('controlGrid');
    const table = document.getElementById('configTable');
    grid.innerHTML = ""; table.innerHTML = "";
    for (let i = 1; i <= 25; i++) {
      if (!teamDB[i]) teamDB[i] = { name: `TEAM ${i}`, logo: `${i}` };
      const t = teamDB[i]; const on = activeMap[i];
      grid.innerHTML += `<div class="grid-item ${on ? '' : 'disabled-slot'}" id="slot-${i}" onclick="sendManual(${i})" style="border-bottom: 5px solid ${fixedColors[i]}"><h2>${i}</h2><p>${t.name}</p></div>`;
      table.innerHTML += `<tr><td><b>${i}</b></td><td><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleSlot(${i}, this.checked)" style="width:20px;"></td><td><input type="text" value="${t.name}" onchange="update(${i}, 'name', this.value)"></td><td><input type="text" value="${t.logo}" onchange="update(${i}, 'logo', this.value)"></td></tr>`;
    }
  }

  function toggleSlot(i, val) { activeMap[i] = val; localStorage.setItem('bgmi_active_map', JSON.stringify(activeMap)); init(); }
  function update(i, k, v) { teamDB[i][k] = v; localStorage.setItem('bgmi_v23_db', JSON.stringify(teamDB)); init(); }

  function importSlots() {
    const text = document.getElementById('import-area').value;
    text.split('\n').forEach(line => {
      const m = line.match(/(\d+)\s*[|•-]\s*(.+)/);
      if (m) { const slot = parseInt(m[1]); if (slot >= 1 && slot <= 25) teamDB[slot].name = m[2].trim(); }
    });
    localStorage.setItem('bgmi_v23_db', JSON.stringify(teamDB)); init();
  }

  function toggleUI(hide) {
    document.querySelectorAll('.settings-area').forEach(el => el.classList.toggle('hide-ui', hide));
    document.getElementById('showSettings').style.display = hide ? 'block' : 'none';
  }

  function sendManual(slot) {
    sendData(manualTarget, slot);
  }

  // Manual override writes straight to Firebase, exactly like your
  // original single-screen sendData() did -- no dependency on the Python
  // engine for this path at all.
  function sendData(screenId, slot) {
    if (!activeMap[slot]) return;
    const t = teamDB[slot];
    const payload = { slot, name: t.name, logo: t.logo, sbg: fixedColors[slot], ts: Date.now() };
    fetch(liveUrl(screenId), { method: "PUT", body: JSON.stringify(payload) });
    document.getElementById('liveStatus').textContent = `SCREEN ${screenId} LIVE: SLOT ${slot} - ${t.name}`;

    document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('active-slot-1', 'active-slot-2'));
    const activeElem = document.getElementById(`slot-${slot}`);
    if (activeElem) activeElem.classList.add(`active-slot-${screenId}`);
  }

  // --- Status readouts only (informational) ---
  async function checkEngine() {
    try {
      const res = await fetch("http://127.0.0.1:5000/");
      if (res.ok) {
        document.getElementById('engineStatus').textContent = "Connected";
        document.getElementById('engineStatus').style.color = "var(--green)";
      } else {
        throw new Error("bad status");
      }
    } catch (e) {
      document.getElementById('engineStatus').textContent = "Not reachable (only needed on the capture PC)";
      document.getElementById('engineStatus').style.color = "var(--red)";
    }
  }

  async function checkLive(screenId, elId) {
    try {
      const res = await fetch(liveUrl(screenId));
      const data = await res.json();
      document.getElementById(elId).textContent = data && data.name ? `${data.slot} - ${data.name}` : "--";
    } catch (e) { /* ignore */ }
  }

  init();
  loadFromCloud();
  checkEngine();
  checkLive(1, 'live1');
  checkLive(2, 'live2');
  setInterval(checkEngine, 5000);
  setInterval(() => { checkLive(1, 'live1'); checkLive(2, 'live2'); }, 2000);
</script>
</body>
</html>
