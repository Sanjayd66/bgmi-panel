<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC DASHBOARD (PC & MOBILE + AUTO OCR)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; }
        
        .header-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 15px; }
        .header-title h2 { font-size: 18px; letter-spacing: 1px; color: #f0f0f0; }
        .ready-tag { color: #00ff66; font-size: 12px; font-weight: bold; }

        .control-panel { background: #161616; padding: 12px 15px; border-radius: 6px; border: 1px solid #262626; display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .control-panel label { font-size: 12px; color: #aaa; font-weight: 600; }
        .control-panel input { background: #080808; border: 1px solid #00ff66; color: #00ff66; font-family: monospace; padding: 6px 10px; border-radius: 4px; width: 220px; font-size: 12px; }
        
        .btn { border: none; padding: 8px 14px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }

        .preview-section { background: #161616; border: 1px solid #262626; border-radius: 6px; padding: 12px; margin-bottom: 20px; display: flex; gap: 20px; }
        .stream-box { position: relative; display: inline-block; background: #000; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        video { display: block; max-width: 480px; height: auto; }
        canvas#selectionCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; }

        .ocr-info { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
        .crop-preview { border: 1px solid #ff9900; background: #000; width: 120px; height: 80px; object-fit: contain; }
        .status-text { font-size: 13px; color: #aaa; }
        .slot-text { font-size: 18px; font-weight: bold; color: #ff9900; }

        /* Slots Grid System */
        .slots-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .slot-card { background: #141414; border: 1px solid #262626; border-radius: 6px; padding: 15px 10px; text-align: center; position: relative; transition: all 0.2s ease; }
        .slot-card.active { border-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .slot-num { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .team-name { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="header-title">
        <h2>SYNC DASHBOARD (PC & MOBILE + AUTO OCR)</h2>
        <span class="ready-tag">READY</span>
    </div>

    <div class="control-panel">
        <label>OCR Server URL:</label>
        <input type="text" id="serverUrl" value="http://127.0.0.1:5000/ocr">
        <button class="btn btn-green" onclick="startScreenShare()">📹 SELECT GAME SCREEN</button>
        <button class="btn btn-red" onclick="stopOCR()">🔴 STOP OCR</button>
    </div>

    <div class="preview-section">
        <div class="stream-box">
            <video id="gameVideo" autoplay playsinline></video>
            <canvas id="selectionCanvas"></canvas>
        </div>

        <div class="ocr-info">
            <label style="font-size: 11px; color: #aaa;">Raw Stream Crop:</label>
            <canvas id="cropCanvas" class="crop-preview"></canvas>
            <div class="status-text">OCR Status: <span id="ocrStatus" style="color: #10b981;">Idle</span></div>
            <div class="slot-text">Detected Slot: <span id="detectedSlot">--</span></div>
        </div>
    </div>

    <!-- 25 Team Slots Grid -->
    <div class="slots-grid" id="slotsGrid"></div>

    <script>
        // Render 25 Slots Grid
        const grid = document.getElementById('slotsGrid');
        for (let i = 1; i <= 25; i++) {
            grid.innerHTML += `
                <div class="slot-card" id="slot-card-${i}">
                    <div class="slot-num">${i}</div>
                    <div class="team-name">TEAM ${i}</div>
                </div>
            `;
        }

        const video = document.getElementById('gameVideo');
        const selCanvas = document.getElementById('selectionCanvas');
        const selCtx = selCanvas.getContext('2d');
        const cropCanvas = document.getElementById('cropCanvas');
        const cropCtx = cropCanvas.getContext('2d');

        let isDragging = false;
        let startX = 0, startY = 0;
        let cropArea = { x: 20, y: 20, width: 80, height: 60 };
        let ocrInterval = null;

        async function startScreenShare() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    selCanvas.width = video.clientWidth;
                    selCanvas.height = video.clientHeight;
                    drawSelection();
                    startOCRProcessing();
                };
            } catch (err) {
                console.error("Screen Share Error:", err);
            }
        }

        // Mouse Drag to Select Box Region
        selCanvas.addEventListener('mousedown', (e) => {
            const rect = selCanvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDragging = true;
        });

        selCanvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = selCanvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            cropArea.x = Math.min(startX, currentX);
            cropArea.y = Math.min(startY, currentY);
            cropArea.width = Math.abs(currentX - startX);
            cropArea.height = Math.abs(currentY - startY);

            drawSelection();
        });

        selCanvas.addEventListener('mouseup', () => { isDragging = false; });

        function drawSelection() {
            selCtx.clearRect(0, 0, selCanvas.width, selCanvas.height);
            selCtx.strokeStyle = '#ff9900';
            selCtx.lineWidth = 2;
            selCtx.fillStyle = 'rgba(255, 153, 0, 0.2)';
            
            selCtx.fillRect(cropArea.x, cropArea.y, cropArea.width, cropArea.height);
            selCtx.strokeRect(cropArea.x, cropArea.y, cropArea.width, cropArea.height);
        }

        function captureCroppedFrame() {
            if (!video.videoWidth || cropArea.width === 0 || cropArea.height === 0) return null;

            const scaleX = video.videoWidth / video.clientWidth;
            const scaleY = video.videoHeight / video.clientHeight;

            const realX = cropArea.x * scaleX;
            const realY = cropArea.y * scaleY;
            const realW = cropArea.width * scaleX;
            const realH = cropArea.height * scaleY;

            cropCanvas.width = realW;
            cropCanvas.height = realH;

            cropCtx.drawImage(video, realX, realY, realW, realH, 0, 0, realW, realH);
            return cropCanvas.toDataURL('image/jpeg', 0.85);
        }

        function startOCRProcessing() {
            if (ocrInterval) clearInterval(ocrInterval);
            document.getElementById('ocrStatus').innerText = "OCR Active...";

            ocrInterval = setInterval(async () => {
                const imgData = captureCroppedFrame();
                if (!imgData) return;

                const url = document.getElementById('serverUrl').value;

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imgData })
                    });
                    const data = await res.json();

                    if (data.success && data.slot !== null) {
                        document.getElementById('detectedSlot').innerText = data.slot;
                        highlightActiveSlot(data.slot);
                    }
                } catch (e) {
                    document.getElementById('ocrStatus').innerText = "Server Error!";
                }
            }, 800);
        }

        function stopOCR() {
            if (ocrInterval) clearInterval(ocrInterval);
            document.getElementById('ocrStatus').innerText = "Stopped";
        }

        function highlightActiveSlot(slotNum) {
            document.querySelectorAll('.slot-card').forEach(card => card.classList.remove('active'));
            const activeCard = document.getElementById(`slot-card-${slotNum}`);
            if (activeCard) {
                activeCard.classList.add('active');
            }
        }
    </script>
</body>
</html>
